<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Library Book Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Open Library Book Finder</h1>

    <h2 id="readingGoal">Reading Goal: 0 Books</h2>

    <div class="controls-container">
        <div class="search-box">
            <input id="searchInput" placeholder="Search books or author">
            <button id="searchBtn">Search</button>
        </div>

        <div class="options-box">
            <label>
                <input type="checkbox" id="filterYear"> Show only books with known publish year
            </label>

            <select id="sortSelect">
                <option value="">Sort by Year</option>
                <option value="oldest">Oldest First</option>
                <option value="newest">Newest First</option>
            </select>
        </div>
    </div>

    <p id="message">Enter a book name to start searching.</p>

    <div id="booksContainer"></div>

    <script src="script.js"></script>

</body>
</html>
